name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

# A push to main never cancels a merge's run; only superseded PR runs are cancelled (agent-team setup §5).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (public repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks version
      - name: Scan full history
        run: ./gitleaks git . --no-banner --redact --exit-code 1
